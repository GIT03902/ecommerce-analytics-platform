name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法编译检查
        run: |
          python -m py_compile config.py app.py run.py setup.py cloud_start.py
          python -m py_compile models/database.py models/rfm.py models/predictor.py
          python -m py_compile services/analytics.py services/auth.py services/exporter.py services/agent.py
          python -m py_compile data/generate_data.py
          echo "全部 Python 文件语法检查通过"

      - name: 一键初始化（生成数据 + 训练模型）
        run: python setup.py

      - name: 验证 Flask 应用可正常导入
        run: |
          python -c "from app import app; print('Flask app 导入成功')"
          python -c "from services.agent import agent; print('Agent 引擎导入成功')"

      - name: 验证数据库表结构
        run: |
          python -c "
          from models.database import get_engine
          from sqlalchemy import text
          eng = get_engine()
          with eng.connect() as c:
              tables = c.execute(text(\"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name\")).fetchall()
              print('数据表:', [t[0] for t in tables])
              assert len(tables) >= 5, '表数量不足'
          print('数据库验证通过')
          "
