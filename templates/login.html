<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 电商销售数据分析与智能预警平台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <h2>电商智能分析平台</h2>
    <div class="desc">销售数据分析与智能预警系统</div>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" name="username" placeholder="请输入用户名" required autofocus>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" name="password" placeholder="请输入密码" required>
      </div>
      <button type="submit" class="btn btn-block">登 录</button>
    </form>
    <div class="login-hint">
      默认账号：<code>admin</code> / <code>admin123</code><br>
      分析师账号：<code>analyst</code> / <code>analyst123</code>
    </div>
  </div>
</div>
</body>
</html>
