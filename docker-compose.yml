version: '3.8'

services:
  web:
    build: .
    container_name: ecommerce-analytics
    ports:
      - "5000:5000"
    environment:
      - DB_MODE=sqlite
      - PYTHONUNBUFFERED=1
    volumes:
      - ./instance:/app/instance
      - ./exports:/app/exports
      - ./models_trained:/app/models_trained
    restart: unless-stopped

  # 如需启用 MySQL 模式，取消下方注释并设置 web 的 DB_MODE=mysql
