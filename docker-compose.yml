version: '3.8'

services:
  web:
    build: .
    container_name: ecommerce-analytics
    ports:
      - "5000:5000"
    environment:
      - DB_MODE=sqlite
      - PYTHONUNBUFFERED=1
    volumes:
      - ./instance:/app/instance
      - ./exports:/app/exports
      - ./models_trained:/app/models_trained
    restart: unless-stopped

# 如需启用数据库服务，请参考 README 的「切换数据库模式」章节，
# 使用 docker run 命令单独启动数据库容器，并通过环境变量 DB_MODE 切换。
